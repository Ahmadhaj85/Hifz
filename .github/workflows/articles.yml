name: Fetch reading articles
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/fetch_articles.py', '.github/workflows/articles.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/fetch_articles.py
      - name: Commit if changed
        run: |
          git config user.name "hifz-bot"
          git config user.email "hifz-bot@users.noreply.github.com"
          git add articles
          git diff --cached --quiet || (git commit -m "Update reading articles" && git push)
